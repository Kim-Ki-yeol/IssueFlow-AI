# 수동 실행만 허용합니다. 새 이슈 생성만으로 AI 분석하지 않습니다.
name: IssueFlow AI - Manual Issue Analysis

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 분석할 이슈 번호
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: issueflow-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Analyze issue (read-only)
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python -m agent.workflow
